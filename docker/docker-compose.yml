name: blast-base

networks:
  internal:
    external: false

volumes:
  blast-db: {}
  django-static: {}
  init-data:
    name: "blast-init-data-$USER"
  object-data: {}
  influxdb-data: {}
  influxdb-config: {}
  grafana-storage: {}

services:
  nginx:
    platform: linux/amd64
    image: nginx:1.26-alpine
    networks:
      - internal
    volumes:
      - django-static:/static
      - init-data:/data
      - ../nginx/default.conf.tpl:/etc/nginx/conf.d/default.conf.tpl:ro
      - ../nginx/nginx_init.sh:/docker-entrypoint.d/nginx_init.sh:ro
    profiles:
      - "full_prod"
      - "slim_prod"
      - "full_dev"
      - "slim_dev"

  app:
    platform: linux/amd64
    image: ${BLAST_IMAGE:-hub.ncsa.illinois.edu/blast/blast:latest}
    command: bash entrypoints/docker-entrypoint.app.sh
    networks:
      internal:
        aliases:
          - ${WEB_APP_HOST}
    volumes:
      - init-data:/mnt/data
      - django-static:/app/static
      - ./dustmapsrc:/tmp/.dustmapsrc:ro
    profiles:
      - "full_prod"
      - "slim_prod"
      - "full_dev"
      - "slim_dev"
      - "ci"
      - "batch"

  database:
    platform: linux/amd64
    image: postgres:16
    restart: always
    volumes:
      - blast-db:/var/lib/postgresql/data
    networks:
      internal:
        aliases:
          - ${DB_HOST}
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    profiles:
      - "full_prod"
      - "slim_prod"
      - "full_dev"
      - "slim_dev"
      - "ci"
      - "batch"

  influxdb:
    platform: linux/amd64
    image: influxdb:2
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    profiles:
      - "full_prod"
      - "full_dev"

  grafana:
    platform: linux/amd64
    image: grafana/grafana-enterprise
    restart: unless-stopped
    networks:
      - internal
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana-storage:/var/lib/grafana
    profiles:
      - "full_prod"
      - "full_dev"

  celery-worker:
    platform: linux/amd64
    image: ${BLAST_IMAGE:-hub.ncsa.illinois.edu/blast/blast:latest}
    command: bash entrypoints/docker-entrypoint.celery.sh
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 2
      resources:
        reservations:
          cpus: '0.25'
          memory: 1G
        limits:
          cpus: "${CELERY_WORKER_LIMIT_CPUS:-4.0}"
          memory: ${CELERY_WORKER_LIMIT_MEMORY:-4G}
    volumes:
      - init-data:/mnt/data
      - django-static:/app/static
      - ./dustmapsrc:/tmp/.dustmapsrc:ro
    profiles:
      - "full_prod"
      - "full_dev"
      - "batch"

  celery-beat:
    platform: linux/amd64
    image: ${BLAST_IMAGE:-hub.ncsa.illinois.edu/blast/blast:latest}
    command: bash entrypoints/docker-entrypoint.celery_beat.sh
    networks:
      - internal
    volumes:
      - init-data:/mnt/data
      - django-static:/app/static
      - ./dustmapsrc:/tmp/.dustmapsrc:ro
    profiles:
      - "full_prod"
      - "full_dev"
      - "slim_dev"
      - "ci"

  redis:
    platform: linux/amd64
    image: redis:alpine
    restart: always
    networks:
      - internal
    profiles:
      - "full_prod"
      - "full_dev"
      - "batch"
      - "ci"

  flower:
    platform: linux/amd64
    image: ${BLAST_IMAGE:-hub.ncsa.illinois.edu/blast/blast:latest}
    command: bash entrypoints/docker-entrypoint.flower.sh
    networks:
      - internal
    ports:
      - 127.0.0.1:${FLOWER_PORT}:8888
    profiles:
      - "full_prod"
      - "full_dev"
      - "batch"

  batch:
    platform: linux/amd64
    image: python:3.9-buster
    command: bash docker-entrypoint.batch.sh
    networks:
      - internal
    volumes:
      - ../batch/run_batch.py:/run_batch.py:ro
      - ../app/entrypoints/wait-for-it.sh:/wait-for-it.sh:ro
      - ../batch/docker-entrypoint.batch.sh:/docker-entrypoint.batch.sh:ro
      - ${BATCH_CSV:-.}/input.csv:ro
      - ${OUTPUT_DIR:-.}/results
    profiles:
      - "batch"

  object-store:
    platform: linux/amd64
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    ports:
      - 127.0.0.1:${S3_CONSOLE_PORT:-9001}:${S3_CONSOLE_PORT:-9001}
      - 127.0.0.1:${S3_SERVER_PORT:-9000}:${S3_SERVER_PORT:-9000}
    networks:
      - internal
    command:
    - server
    - /data
    - --address
    - ":${S3_SERVER_PORT:-9000}"
    - --console-address
    - ":${S3_CONSOLE_PORT:-9001}"
    volumes:
      - object-data:/data
      - init-data:/init_data
    profiles:
      - "full_prod"
      - "slim_prod"
      - "full_dev"
      - "slim_dev"
      - "ci"
      - "batch"
