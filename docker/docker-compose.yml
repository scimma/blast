name: blast-base

x-env-garage: &env-garage
  RUST_LOG: garage=info
  GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_DEFAULT_ACCESS_KEY}"
  GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_DEFAULT_SECRET_KEY}"
  GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET}"
  GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN}"
  GARAGE_METRICS_TOKEN: "${GARAGE_METRICS_TOKEN}"
  GARAGE_DEFAULT_BUCKET: "${S3_BUCKET}"
x-env-s3: &env-s3
  AWS_S3_ACCESS_KEY_ID: "${GARAGE_DEFAULT_ACCESS_KEY}"
  AWS_S3_SECRET_ACCESS_KEY: "${GARAGE_DEFAULT_SECRET_KEY}"

networks:
  internal:
    external: false

volumes:
  blast-db: {}
  django-static: {}
  init-data:
    name: "blast-init-data-$USER"
  object-data: {}
  garage-meta: {}
  garage-config: {}
  influxdb-data: {}
  influxdb-config: {}
  grafana-storage: {}

services:
  nginx:
    platform: linux/amd64
    image: nginx:1.26-alpine
    networks:
      - internal
    volumes:
      - django-static:/static
      - init-data:/data
      - ../nginx/default.conf.tpl:/etc/nginx/conf.d/default.conf.tpl:ro
      - ../nginx/nginx_init.sh:/docker-entrypoint.d/nginx_init.sh:ro
    profiles:
      - "full_prod"
      - "slim_prod"
      - "full_dev"
      - "slim_dev"

  app:
    platform: linux/amd64
    image: ${BLAST_IMAGE:-hub.ncsa.illinois.edu/blast/blast:latest}
    command: bash entrypoints/docker-entrypoint.app.sh
    networks:
      internal:
        aliases:
          - ${WEB_APP_HOST}
    depends_on:
      object-store:
        condition: service_healthy
    volumes:
      - init-data:/mnt/data
      - django-static:/app/static
      - ./dustmapsrc:/tmp/.dustmapsrc:ro
    environment:
      <<: [
        *env-s3,
      ]
    profiles:
      - "full_prod"
      - "slim_prod"
      - "full_dev"
      - "slim_dev"
      - "ci"
      - "batch"

  database:
    platform: linux/amd64
    image: postgres:16
    restart: always
    volumes:
      - blast-db:/var/lib/postgresql/data
    networks:
      internal:
        aliases:
          - ${DB_HOST}
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    profiles:
      - "full_prod"
      - "slim_prod"
      - "full_dev"
      - "slim_dev"
      - "ci"
      - "batch"

  influxdb:
    platform: linux/amd64
    image: influxdb:2
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    profiles:
      - "full_prod"
      - "full_dev"

  grafana:
    platform: linux/amd64
    image: grafana/grafana-enterprise
    restart: unless-stopped
    networks:
      - internal
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana-storage:/var/lib/grafana
    profiles:
      - "full_prod"
      - "full_dev"

  celery-worker:
    platform: linux/amd64
    image: ${BLAST_IMAGE:-hub.ncsa.illinois.edu/blast/blast:latest}
    command: bash entrypoints/docker-entrypoint.celery.sh
    networks:
      - internal
    depends_on:
      object-store:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 2
      resources:
        reservations:
          cpus: '0.25'
          memory: 1G
        limits:
          cpus: "${CELERY_WORKER_LIMIT_CPUS:-4.0}"
          memory: ${CELERY_WORKER_LIMIT_MEMORY:-4G}
    environment:
      <<: [
        *env-s3,
      ]
    volumes:
      - init-data:/mnt/data
      - django-static:/app/static
      - ./dustmapsrc:/tmp/.dustmapsrc:ro
    profiles:
      - "full_prod"
      - "full_dev"
      - "batch"

  celery-beat:
    platform: linux/amd64
    image: ${BLAST_IMAGE:-hub.ncsa.illinois.edu/blast/blast:latest}
    command: bash entrypoints/docker-entrypoint.celery_beat.sh
    networks:
      - internal
    healthcheck:
      test: ["CMD", "bash", "-c", "[ -f /tmp/celery-beat-ready ]"]
      interval: 10s
      timeout: 5s
      retries: 1
      start_period: 600s
    environment:
      <<: [
        *env-s3,
      ]
    volumes:
      - init-data:/mnt/data
      - django-static:/app/static
      - ./dustmapsrc:/tmp/.dustmapsrc:ro
    profiles:
      - "full_prod"
      - "full_dev"
      - "slim_dev"
      - "ci"

  redis:
    platform: linux/amd64
    image: redis:alpine
    restart: always
    networks:
      - internal
    profiles:
      - "full_prod"
      - "full_dev"
      - "batch"
      - "ci"

  flower:
    platform: linux/amd64
    image: ${BLAST_IMAGE:-hub.ncsa.illinois.edu/blast/blast:latest}
    command: bash entrypoints/docker-entrypoint.flower.sh
    networks:
      - internal
    ports:
      - 127.0.0.1:${FLOWER_PORT:-8888}:${FLOWER_PORT:-8888}
    profiles:
      - "full_prod"
      - "full_dev"
      - "batch"

  batch:
    platform: linux/amd64
    image: python:3.9-buster
    command: bash docker-entrypoint.batch.sh
    networks:
      - internal
    volumes:
      - ../batch/run_batch.py:/run_batch.py:ro
      - ../app/entrypoints/wait-for-it.sh:/wait-for-it.sh:ro
      - ../batch/docker-entrypoint.batch.sh:/docker-entrypoint.batch.sh:ro
      - ${BATCH_CSV:-.}/input.csv:ro
      - ${OUTPUT_DIR:-.}/results
    profiles:
      - "batch"

  garage-config:
    platform: linux/amd64
    image: ${BLAST_IMAGE:-hub.ncsa.illinois.edu/blast/blast:latest}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Rendering Garage config template..."
        cat /tmp/garage.tpl.toml | \
        sed 's/{{S3_SERVER_PORT}}/${S3_SERVER_PORT:-9000}/g' | \
        sed 's/{{S3_RPC_PORT}}/${S3_RPC_PORT:-9001}/g' | \
        sed 's/{{S3_ADMIN_PORT}}/${S3_ADMIN_PORT:-9003}/g' > /etc/garage.toml
        cat /etc/garage.toml
    volumes:
      - garage-config:/etc
      - ./garage.tpl.toml:/tmp/garage.tpl.toml:ro

  object-store:
    platform: linux/amd64
    image: dxflrs/garage:v2.4.1
    command:
      -  /garage
      -  server
      -  --single-node 
      -  --default-bucket
    restart: unless-stopped
    depends_on:
      garage-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/garage", "json-api", "GetClusterHealth"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
      start_interval: 5s
    ports:
      - "127.0.0.1:${S3_SERVER_PORT:-9000}:${S3_SERVER_PORT:-9000}"
      - "127.0.0.1:${S3_RPC_PORT:-9001}:${S3_RPC_PORT:-9001}"
      - "127.0.0.1:${S3_ADMIN_PORT:-9003}:${S3_ADMIN_PORT:-9003}"
    networks:
      - internal
    environment:
      <<: [
        *env-garage,
      ]
    volumes:
      - garage-config:/etc
      - garage-meta:/var/lib/garage/meta
      - object-data:/var/lib/garage/data
      - init-data:/init_data
    profiles:
      - "full_prod"
      - "slim_prod"
      - "full_dev"
      - "slim_dev"
      - "ci"
      - "batch"
