name: blast-ci-$USER

networks:
  internal:
    external: false

services:

  app:
    extends:
      file: docker-compose.yml
      service: app
    environment:
      - "TEST_MODE=1"
    env_file:
      - ../env/.env.default
      - ../env/.env.ci

  database:
    extends:
      file: docker-compose.yml
      service: database
    env_file:
      - ../env/.env.default
      - ../env/.env.ci
