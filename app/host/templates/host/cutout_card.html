{% extends "host/card_template.html" %}

{% load crispy_forms_tags %}

<!-- title -->
{% block title %}<h4>Imaging data</h4>{% endblock %}

<!-- body -->
{% block body %}
<div id="cutout-img-div" class="d-flex justify-content-center align-items-center">
    <div id="cutout-loader-mask" class="loader-mask"></div>
    <div id="loading-indicator" class="loader"></div>
    <div id="cutout-img-bokeh" style="width: 100%;">
    {% if bokeh_cutout_div %}
    {{ bokeh_cutout_div | safe }}
    {% else %}
    <button title="Click the image to load the interactive plot." id="cutout-img-button" onclick="cutoutImgClick('{{ transient.name }}', '{{ cutout.name }}')">
        <img id="cutout-img" src="data:image/png;base64,{{ image_data_encoded }}" style="width: 100%;"/>
    </button>
    <br>
    {% endif %}
    </div>
</div>
<form class="form" , method="POST">
    {% csrf_token %}
    <div class="input-group mb-10">
        {{ filter_select_form.filters }}
        <div class="input-group-append">
            <button class="btn btn-primary" type="button"
                onclick="cutoutImgClick('{{ transient.name }}', document.getElementById('id_filters').value)">Get Cutout</button>
            <button class="btn btn-outline-secondary" type="button" id="edit-aperture-btn"
                onclick="toggleApertureEdit('{{ transient.name }}')">Enable Aperture Editing</button>
            <button class="btn btn-success" type="button" id="save-aperture-btn"
                onclick="saveApertureChanges('{{ transient.name }}')" disabled>Save Aperture Changes</button>
        </div>
    </div>
</form>
<script>
    // tracks whether aperture-editing mode is currently on, so the toggle button knows what to switch to and re-request on the next click
    document.getElementById('loading-indicator').style.display = "none";
    var apertureEditable = false;
    
    // caches unsaved edits fired by EDITABLE_APERTURE_HANDLE_JS, keyed by apertureId+apertureType
    var pendingApertureChanges = {};

    window.addEventListener('blast:aperture-change', function (evt) {
        var d = evt.detail;
        pendingApertureChanges[d.apertureId + ':' + d.apertureType] = d;

        var saveBtn = document.getElementById('save-aperture-btn');
        if (saveBtn) {
            saveBtn.disabled = Object.keys(pendingApertureChanges).length === 0;
        }
    });

    // Cache of the latest, unsaved aperture geometry per aperture ID, populated live as the user drags an editable aperture.
    window.blastApertureCache = window.blastApertureCache || {};

    window.addEventListener('blast:aperture-change', function (e) {
        const { apertureId, apertureType, x, y, semiMajor, semiMinor, thetaRadians } = e.detail;
        window.blastApertureCache[apertureId] = {
            apertureType, x, y, semiMajor, semiMinor, thetaRadians,
        };
    });

    // function toggleApertureEdit(transient) {
    //     apertureEditable = !apertureEditable;
    //     var btn = document.getElementById('edit-aperture-btn');
    //     btn.textContent = apertureEditable ? "Disable Aperture Editing" : "Enable Aperture Editing";
    //     btn.classList.toggle('btn-outline-secondary', !apertureEditable);
    //     btn.classList.toggle('btn-secondary', apertureEditable);
    //     var filter = document.getElementById('id_filters').value;
    //     cutoutImgClick(transient, filter, apertureEditable);
    // }

    function toggleApertureEdit(transient) {
        apertureEditable = !apertureEditable;
        var btn = document.getElementById('edit-aperture-btn');
        btn.textContent = apertureEditable ? "Disable Aperture Editing" : "Enable Aperture Editing";
        btn.classList.toggle('btn-outline-secondary', !apertureEditable);
        btn.classList.toggle('btn-secondary', apertureEditable);

        if (!apertureEditable) {
            // Turning editing off: freeze the plot exactly as it is instead of
            // re-fetching from the server. A re-fetch pulls pristine geometry
            // from the DB and wipes out any local, unsaved drag edits.
            if (freezeApertureEditing()) {
                return;
            }
            // If the Bokeh models weren't found for some reason, fall back to
            // a normal refetch so the button doesn't just do nothing.
        }

        var filter = document.getElementById('id_filters').value;
        cutoutImgClick(transient, filter, apertureEditable);
    }

    var APERTURE_EDIT_RENDERER_NAMES = [
        'aperture_handle_renderer',
        'aperture_center_renderer',
        'ghost_aperture_renderer',
    ];

    function freezeApertureEditing() {
        if (typeof Bokeh === 'undefined' || !Bokeh.documents || !Bokeh.documents.length) {
            return false;
        }
        var found = false;
        Bokeh.documents.forEach(function (doc) {
            var tool = doc.get_model_by_name && doc.get_model_by_name('aperture_handle_tool');
            // var handles = doc.get_model_by_name && doc.get_model_by_name('aperture_handle_renderer') && doc.get_model_by_name('aperture_center_renderer');
            if (tool) {
                tool.active = false;
                found = true;
            }
            APERTURE_EDIT_RENDERER_NAMES.forEach(function (name) {
                var handle = doc.get_model_by_name && doc.get_model_by_name(name);
                if (handle) {
                    handle.visible = false;
                    found = true;
                }
            });
            // if (handles) {
            //     handles.visible = false;
            //     found = true;
            // }
        });
        return found;
    }

    function saveApertureChanges(transient) {
        var changes = Object.values(pendingApertureChanges);
        if (!changes.length) return;
        $.ajax({
            url: "{% url 'save_aperture_changes' %}",
            type: "POST",
            headers: { "X-CSRFToken": "{{ csrf_token }}" },
            contentType: "application/json",
            data: JSON.stringify({ transient_name: transient, apertures: changes }),
            success: function (resp) {
                pendingApertureChanges = {};
                var saveBtn = document.getElementById('save-aperture-btn');
                if (saveBtn) {
                    saveBtn.disabled = true;
                }
            },
            error: function (xhr) {
                console.error("Failed to save aperture changes:", xhr.responseText);
            },
        });
    }

    document.getElementById('loading-indicator').style.display = "none";
    function cutoutImgClick(transient, filter, editable) {
        document.getElementById('loading-indicator').style.display = "block";
        $("#cutout-loader-mask").show();
        $.ajax({
            url: "{% url 'cutout_fits_plot' %}",
            type: "GET",
            data: {
                transient_name: transient,
                filter: filter,
                editable: editable
            },
            success: function (resp) {
                document.getElementById("cutout-img-bokeh").innerHTML = resp.bokeh_cutout_div;
                document.getElementById("bokeh-cutout-script-wrapper").innerHTML = ''
                var cutout_script = document.createElement("script");
                cutout_script.type = 'text/javascript';
                var raw_script = resp.bokeh_cutout_script;
                var raw_script_trimmed = raw_script.trim();
                var closeMarker = "<" + "/script>";
                var openTagEnd = raw_script_trimmed.indexOf(">") + 1;
                var closeTagStart = raw_script_trimmed.lastIndexOf(closeMarker);
                var script_trimmed = raw_script_trimmed.substring(openTagEnd, closeTagStart);
                cutout_script.text = script_trimmed;
                document.getElementById("bokeh-cutout-script-wrapper").appendChild(cutout_script);
                document.getElementById('cutout-img-div').style.display = "block";
                document.getElementById('loading-indicator').style.display = "none";
                $("#cutout-loader-mask").hide();
            },
        });
    }
</script>
<style>
    #cutout-img {
        max-width: 100%;
        max-height: 100%;
    }

    #cutout-img-button {
        background: transparent;
        border: none !important;
    }
</style>
<div id="bokeh-cutout-script-wrapper"></div>
{% endblock %}
